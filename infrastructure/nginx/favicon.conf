# Shared favicon for the portal, map and every public challenge host.
location = /favicon.png {
    alias /srv/oracle-assets/favicon.png;
    default_type image/png;
    add_header Cache-Control "public, max-age=86400";
}
location = /favicon.ico {
    alias /srv/oracle-assets/favicon.ico;
    default_type image/x-icon;
    add_header Cache-Control "public, max-age=86400";
}
