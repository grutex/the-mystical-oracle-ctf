<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TABULA GLORIAE | Leaderboard CTF & Oráculo Abissal</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Cinzel Decorative, Cinzel, Cormorant Garamond, Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- External Custom CSS -->
    <link rel="stylesheet" href="leaderboard.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        occult: {
                            bg: '#050508',
                            surface: '#0b0814',
                            purple: '#9d4edd',
                            cyan: '#00f3ff',
                            gold: '#ffd700',
                            crimson: '#e63946',
                            glow: '#7b2cbf',
                            green: '#10b981'
                        }
                    },
                    fontFamily: {
                        cinzelDeco: ['Cinzel Decorative', 'serif'],
                        cinzel: ['Cinzel', 'serif'],
                        cormorant: ['Cormorant Garamond', 'serif'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen flex flex-col justify-between relative selection:bg-occult-purple selection:text-white">

    <!-- Cosmic Dust Background Particle Canvas -->
    <canvas id="bg-canvas" class="fixed inset-0 pointer-events-none z-0"></canvas>

    <!-- HEADER BAR -->
    <header class="relative z-20 w-full px-4 sm:px-6 py-3 flex flex-wrap justify-between items-center border-b border-purple-900/30 backdrop-blur-md bg-black/60 gap-y-2">
        
        <!-- Left Title & Navigation Link back to Oracle Landing -->
        <div class="flex items-center space-x-3">
            <a href="/oracle" class="w-9 h-9 rounded-full border border-occult-gold flex items-center justify-center bg-purple-950/60 shadow-[0_0_15px_rgba(255,215,0,0.4)] hover:scale-110 transition-transform" title="Voltar ao Oráculo">
                <span class="text-occult-gold font-cinzel text-base font-bold">👁</span>
            </a>
            <div>
                <h1 class="font-cinzel text-base sm:text-lg font-bold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-occult-gold via-purple-300 to-occult-cyan">
                    TABULA GLORIAE
                </h1>
                <p class="text-[9px] sm:text-[10px] tracking-widest font-cinzel text-purple-400 uppercase">CLASSIFICAÇÃO DOS BUSCADORES ABISSAIS</p>
            </div>
        </div>

        <!-- Center Subtitle -->
        <div class="order-3 sm:order-2 w-full sm:w-auto text-center my-1 sm:my-0">
            <p class="font-cormorant italic text-base sm:text-lg font-semibold text-purple-200 tracking-wide text-glow-purple">
                "As marcas eternizadas no tempo"
            </p>
        </div>

        <!-- Right Action Controls -->
        <div class="order-2 sm:order-3 flex items-center space-x-2 sm:space-x-3">
            <!-- Back to Oracle Button -->
            <a href="/oracle" class="p-2 sm:px-3 sm:py-1.5 rounded-full border border-purple-500/40 bg-purple-950/50 hover:border-occult-cyan hover:text-occult-cyan text-xs font-cinzel text-purple-200 transition-all duration-300 shadow-md flex items-center space-x-1.5">
                <span>←</span>
                <span class="hidden sm:inline font-semibold">ORÁCULO</span>
            </a>

            <!-- User Badge Score Sync -->
            <div class="p-2 sm:px-3 sm:py-1.5 rounded-full border border-occult-gold/40 bg-purple-950/60 text-xs font-cinzel text-occult-gold flex items-center space-x-1.5">
                <span id="current-user-display" class="font-bold">Robbs</span>
                <span id="current-score-badge" class="bg-purple-900/80 px-2 py-0.5 rounded-full font-bold border border-purple-700/50 text-[10px]">0 pts</span>
            </div>

            <!-- Audio Toggle Button -->
            <button id="audio-toggle" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-full border border-purple-500/40 bg-purple-950/50 hover:border-occult-cyan text-xs font-cinzel text-purple-300 hover:text-occult-cyan transition-all duration-300 shadow-md">
                <span id="audio-icon" class="text-xs">🔇</span>
                <span id="audio-status" class="hidden md:inline text-[11px] uppercase font-bold tracking-wider">SOM</span>
            </button>
            <button data-admin-help hidden title="Instruções da leaderboard" aria-label="Instruções da leaderboard" class="w-8 h-8 rounded-full border border-purple-500/40 bg-purple-950/50 flex items-center justify-center text-xs font-cinzel text-purple-300 hover:border-occult-gold hover:text-occult-gold transition-all duration-300">?</button>
        </div>
    </header>

    <!-- MAIN LEADERBOARD CONTAINER -->
    <main class="relative z-10 flex-grow max-w-6xl w-full mx-auto px-3 sm:px-6 py-6 flex flex-col space-y-4">
        
        <!-- TOP FILTER & CONTROLS PANEL -->
        <div class="glass-card rounded-2xl p-4 sm:p-5 flex flex-col md:flex-row gap-4 items-center justify-between border border-purple-600/30">
            
            <!-- Filter Title & Search Input -->
            <div class="w-full md:w-auto flex flex-col sm:flex-row items-center gap-3">
                <div class="flex items-center space-x-2 text-occult-gold font-cinzel text-sm font-bold shrink-0">
                    <span>⚔</span>
                    <span>ORDENAR TABELA:</span>
                </div>
                <!-- Search Input -->
                <div class="relative w-full sm:w-64 input-glow rounded-xl bg-black/60 border border-purple-700/40">
                    <input 
                        type="text" 
                        id="search-input" 
                        placeholder="Buscar por buscador..." 
                        class="w-full bg-transparent px-3.5 py-1.5 text-xs text-purple-100 placeholder-purple-400/50 focus:outline-none font-cormorant tracking-wide"
                    />
                </div>
            </div>

            <!-- Sorting Selectors (Field & Direction) -->
            <div class="w-full md:w-auto flex flex-wrap items-center justify-end gap-2.5">
                
                <!-- Field Selector: Pontuação, Nome, Data da última flag -->
                <div class="flex items-center space-x-1.5 bg-black/50 border border-purple-700/40 rounded-xl px-2.5 py-1.5 select-glow">
                    <label for="sort-field-select" class="text-[10px] font-cinzel text-purple-300 uppercase tracking-wider">Campo:</label>
                    <select id="sort-field-select" class="bg-transparent text-xs font-cinzel font-semibold text-occult-cyan focus:outline-none cursor-pointer">
                        <option value="score" class="bg-occult-surface text-purple-200">Pontuação</option>
                        <option value="name" class="bg-occult-surface text-purple-200">Nome</option>
                        <option value="lastFlagDate" class="bg-occult-surface text-purple-200">Data da Última Flag</option>
                    </select>
                </div>

                <!-- Order Direction Selector: Ascendente vs Descendente -->
                <div class="flex items-center space-x-1.5 bg-black/50 border border-purple-700/40 rounded-xl px-2.5 py-1.5 select-glow">
                    <label for="sort-dir-select" class="text-[10px] font-cinzel text-purple-300 uppercase tracking-wider">Ordem:</label>
                    <select id="sort-dir-select" class="bg-transparent text-xs font-cinzel font-semibold text-occult-gold focus:outline-none cursor-pointer">
                        <option value="desc" class="bg-occult-surface text-purple-200">Descendente (▼)</option>
                        <option value="asc" class="bg-occult-surface text-purple-200">Ascendente (▲)</option>
                    </select>
                </div>

                <!-- Toggle Order Direction Button Shortcut -->
                <button id="toggle-dir-btn" title="Inverter Ordem Ascendente/Descendente" class="px-3 py-1.5 rounded-xl bg-purple-950/80 border border-purple-500/40 hover:border-occult-cyan text-xs font-cinzel font-bold text-purple-200 hover:text-occult-cyan transition-all">
                    <span id="dir-icon">▼</span>
                </button>
            </div>
        </div>

        <div class="glass-card rounded-2xl p-4 border border-purple-600/30 space-y-3">
            <div id="board-controls" hidden class="flex flex-wrap items-center gap-2">
                <label for="board-select" class="text-xs font-cinzel text-purple-300">Classificação</label>
                <select id="board-select" class="bg-black/60 border border-purple-700/40 rounded-lg p-2 text-xs text-purple-200">
                    <option value="players">Jogadores</option>
                    <option value="testers">Testadores</option>
                </select>
            </div>
            <p id="board-label" hidden class="text-xs font-cinzel text-purple-300"></p>
            <div id="organizer-controls" hidden class="flex flex-wrap items-center gap-3">
                <button id="start-contest" class="snapshot-btn">Iniciar CTF</button>
                <button id="pause-contest" class="snapshot-btn" disabled>Pausar CTF</button>
                <button id="reset-contest" class="snapshot-btn">Resetar CTF</button>
                <button id="save-snapshot" class="snapshot-btn">📷 Tirar print / salvar</button>
                <button id="close-contest" class="snapshot-btn">Encerrar CTF e salvar</button>
                <form id="schedule-form" class="flex flex-wrap items-center gap-2">
                    <label for="ends-at" class="text-xs font-cinzel text-purple-300">Encerramento:</label>
                    <input id="ends-at" type="datetime-local" step="1" required class="bg-black/60 border border-purple-700/40 rounded-lg p-2 text-xs text-purple-200">
                    <button class="snapshot-btn" type="submit">Salvar horário</button>
                </form>
            </div>
            <div id="snapshot-controls" hidden class="flex flex-wrap items-center gap-3">
                <label for="snapshot-select" class="text-xs font-cinzel text-purple-300">Histórico:</label>
                <select id="snapshot-select" class="bg-black/60 border border-purple-700/40 rounded-lg p-2 text-xs text-purple-200"><option value="">Classificação atual</option></select>
                <button id="download-png" class="snapshot-btn" disabled>Baixar print (PNG)</button>
                <button id="download-csv" class="snapshot-btn" disabled>Baixar CSV</button>
            </div>
            <p id="contest-status" class="text-xs text-occult-gold"></p>
            <p id="snapshot-status" role="status" aria-live="polite" class="text-xs text-purple-300"></p>
        </div>

        <!-- MATRIX LEADERBOARD TABLE CONTAINER -->
        <div class="glass-card rounded-2xl p-2 sm:p-4 border border-purple-600/30 overflow-x-auto shadow-[0_0_40px_rgba(5,5,8,0.9)]">
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <!-- Colocação (Rank) -->
                        <th class="text-center w-16 sm:w-20">
                            Colocação
                        </th>
                        <!-- Nome -->
                        <th class="text-left sortable-header" data-sort="name" title="Clique para ordenar por Nome">
                            Buscador (Nome) <span class="sort-indicator text-[10px]" id="sort-ind-name"></span>
                        </th>
                        <!-- Pontuação -->
                        <th class="text-center sortable-header active-sort" data-sort="score" title="Clique para ordenar por Pontuação">
                            Pontuação <span class="sort-indicator text-[10px]" id="sort-ind-score">▼</span>
                        </th>
                        <!-- Data / Tempo desde a última flag -->
                        <th class="text-right sortable-header" data-sort="lastFlagDate" title="Clique para ordenar pela Data da Última Flag">
                            Última Flag Válida <span class="sort-indicator text-[10px]" id="sort-ind-lastFlagDate"></span>
                        </th>
                    </tr>
                </thead>
                <tbody id="leaderboard-tbody">
                    <!-- Dynamic Table Rows Rendered via JS -->
                </tbody>
            </table>

            <!-- Empty State Message -->
            <div id="empty-state" class="hidden py-12 text-center">
                <p class="text-lg font-cormorant italic text-purple-300">Nenhum buscador encontrado nas sombras da busca...</p>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="relative z-20 w-full text-center py-4 text-xs font-cinzel text-purple-400/60 border-t border-purple-900/30 bg-black/40">
        <p>ORACULUM OCCULTUM CTF • TABULA GLORIAE</p>
    </footer>

    <script src="/oracle-runtime.js"></script>
    <script src="../portal-api.js"></script>
    <!-- INTERACTIVE SCRIPT -->
    <script>
        let leaderboardData = [];
        let localUsername = '';
        let localScore = 0;
        let activeSnapshot = null;
        let currentUserId = null;
        let latestContest = {};
        let lastServerTime = null;

        // State variables for sorting
        let currentSortField = 'score'; // 'score' | 'name' | 'lastFlagDate'
        let currentSortDir = 'desc';   // 'asc' | 'desc'
        let searchQuery = '';

        // Helper to format Date / Relative Time since last flag
        function formatLastFlagTime(isoString) {
            if (!isoString) return 'Sem registros';
            const date = new Date(isoString);
            const now = new Date();
            const diffInSeconds = Math.floor((now - date) / 1000);

            if (diffInSeconds < 60) return 'Agora mesmo';
            if (diffInSeconds < 3600) return `${Math.floor(diffInSeconds / 60)} min atrás`;
            if (diffInSeconds < 86400) return `${Math.floor(diffInSeconds / 3600)} h atrás`;
            
            // Format as DD/MM/YYYY HH:mm
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            const hours = String(date.getHours()).padStart(2, '0');
            const mins = String(date.getMinutes()).padStart(2, '0');
            
            return `${day}/${month}/${year} ${hours}:${mins}`;
        }

        // Render Matrix Table
        function renderLeaderboard() {
            const tbody = document.getElementById('leaderboard-tbody');
            const emptyState = document.getElementById('empty-state');

            // 1. Filter by search query
            let filtered = leaderboardData.filter(item => 
                [item.name, item.username, item.email].some(value =>
                    String(value ?? '').toLowerCase().includes(searchQuery.toLowerCase()))
            );

            // 2. Sort data according to currentSortField and currentSortDir
            filtered.sort((a, b) => {
                let valA = a[currentSortField];
                let valB = b[currentSortField];

                if (currentSortField === 'name') {
                    valA = valA.toLowerCase();
                    valB = valB.toLowerCase();
                    return currentSortDir === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
                } 
                else if (currentSortField === 'lastFlagDate') {
                    const timeA = new Date(valA).getTime();
                    const timeB = new Date(valB).getTime();
                    return currentSortDir === 'asc' ? timeA - timeB : timeB - timeA;
                } 
                else { // score
                    if (valA === valB) {
                        // Tie-breaker: earlier flag date wins
                        return new Date(a.lastFlagDate).getTime() - new Date(b.lastFlagDate).getTime();
                    }
                    return currentSortDir === 'asc' ? valA - valB : valB - valA;
                }
            });

            // 3. Render Table HTML
            tbody.innerHTML = '';

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            filtered.forEach((player, index) => {
                const rankPos = player.rank;
                let rankBadgeClass = 'rank-other';
                let rankIcon = rankPos;

                if (rankPos === 1) { rankBadgeClass = 'rank-1'; rankIcon = '🥇'; }
                else if (rankPos === 2) { rankBadgeClass = 'rank-2'; rankIcon = '🥈'; }
                else if (rankPos === 3) { rankBadgeClass = 'rank-3'; rankIcon = '🥉'; }

                const isUser = player.isCurrentUser;
                const tr = document.createElement('tr');
                tr.className = `leaderboard-row ${isUser ? 'current-user-row' : ''}`;

                tr.innerHTML = `
                    <td class="text-center font-bold">
                        <span class="rank-badge ${rankBadgeClass}">${rankIcon}</span>
                    </td>
                    <td class="text-left font-cinzel font-semibold text-purple-100">
                        <div class="flex items-center space-x-2">
                            <span>${Portal.escape(player.name)}</span>
                            ${player.hasCrown ? '<span class="text-base text-occult-gold drop-shadow-[0_0_8px_rgba(255,215,0,0.8)]" role="img" aria-label="CTF concluído" title="CTF concluído">👑</span>' : ''}
                            ${isUser ? '<span class="text-[9px] px-2 py-0.5 rounded-full bg-occult-cyan/20 border border-occult-cyan text-occult-cyan uppercase font-bold">Você</span>' : ''}
                        </div>
                        <div class="mt-1 text-xs font-sans font-normal text-purple-300 break-words">
                            ${Portal.escape(player.username || '')}${player.email ? ' · ' + Portal.escape(player.email) : ''}
                        </div>
                    </td>
                    <td class="text-center font-cinzel font-bold text-occult-gold text-sm sm:text-base">
                        ${player.score} <span class="text-[10px] text-purple-400 font-normal">pts</span>
                    </td>
                    <td class="text-right font-cormorant text-xs sm:text-sm text-purple-300 italic">
                        ${formatLastFlagTime(player.lastFlagDate)}
                    </td>
                `;

                tbody.appendChild(tr);
            });

            // Update UI indicators on headers
            updateHeaderIndicators();
        }

        // Update Sort Headers UI Indicators
        function updateHeaderIndicators() {
            document.querySelectorAll('.sortable-header').forEach(header => {
                const field = header.getAttribute('data-sort');
                const indEl = document.getElementById(`sort-ind-${field}`);

                if (field === currentSortField) {
                    header.classList.add('active-sort');
                    if (indEl) indEl.textContent = currentSortDir === 'asc' ? '▲' : '▼';
                } else {
                    header.classList.remove('active-sort');
                    if (indEl) indEl.textContent = '';
                }
            });

            document.getElementById('sort-field-select').value = currentSortField;
            document.getElementById('sort-dir-select').value = currentSortDir;
            document.getElementById('dir-icon').textContent = currentSortDir === 'asc' ? '▲' : '▼';
        }

        // Event Listeners for Filters
        document.getElementById('sort-field-select').addEventListener('change', (e) => {
            currentSortField = e.target.value;
            renderLeaderboard();
        });

        document.getElementById('sort-dir-select').addEventListener('change', (e) => {
            currentSortDir = e.target.value;
            renderLeaderboard();
        });

        document.getElementById('toggle-dir-btn').addEventListener('click', () => {
            currentSortDir = currentSortDir === 'asc' ? 'desc' : 'asc';
            renderLeaderboard();
        });

        document.getElementById('search-input').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderLeaderboard();
        });

        document.querySelectorAll('.sortable-header').forEach(header => {
            header.addEventListener('click', () => {
                const field = header.getAttribute('data-sort');
                if (currentSortField === field) {
                    currentSortDir = currentSortDir === 'asc' ? 'desc' : 'asc';
                } else {
                    currentSortField = field;
                    currentSortDir = field === 'name' ? 'asc' : 'desc';
                }
                renderLeaderboard();
            });
        });

        // Background Particles Canvas Animation
        const bgCanvas = document.getElementById('bg-canvas');
        const bgCtx = bgCanvas.getContext('2d');
        let particles = [];

        function resizeBgCanvas() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
        }
        resizeBgCanvas();
        window.addEventListener('resize', resizeBgCanvas);

        class CosmicParticle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * bgCanvas.width;
                this.y = Math.random() * bgCanvas.height;
                this.size = Math.random() * 1.8 + 0.3;
                this.speedX = (Math.random() - 0.5) * 0.35;
                this.speedY = (Math.random() - 0.5) * 0.35;
                this.alpha = Math.random() * 0.7 + 0.2;
                this.pulse = Math.random() * 0.02 + 0.005;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.alpha += Math.sin(Date.now() * this.pulse) * 0.005;
                if (this.x < 0 || this.x > bgCanvas.width || this.y < 0 || this.y > bgCanvas.height) this.reset();
            }
            draw() {
                bgCtx.fillStyle = `rgba(157, 78, 221, ${Math.max(0, this.alpha)})`;
                bgCtx.beginPath();
                bgCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                bgCtx.fill();
            }
        }

        for (let i = 0; i < 75; i++) particles.push(new CosmicParticle());

        function renderBgCanvas() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(renderBgCanvas);
        }
        renderBgCanvas();

        // Audio System
        let isMuted = true;
        const audioBtn = document.getElementById('audio-toggle');
        const audioIcon = document.getElementById('audio-icon');
        const audioStatus = document.getElementById('audio-status');

        audioBtn.addEventListener('click', () => {
            isMuted = !isMuted;
            audioIcon.textContent = isMuted ? "🔇" : "🔊";
            if (audioStatus) audioStatus.textContent = isMuted ? "SOM" : "SOM ON";
            audioBtn.classList.toggle('border-occult-cyan', !isMuted);
            audioBtn.classList.toggle('text-occult-cyan', !isMuted);
        });

        // Initial Render
        renderLeaderboard();
    </script>
    <script src="leaderboard.js"></script>
</body>
</html>
